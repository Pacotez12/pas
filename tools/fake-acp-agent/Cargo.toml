[package]
name = "fake-acp-agent"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
agent-client-protocol = { version = "5", features = ["stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
agent-client-protocol = { version = "5", features = ["process"] }
tempfile = "3"
