[package]
name = "pas-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pas"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
pas-core = { path = "../pas-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
