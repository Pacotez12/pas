[package]
name = "pasd"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
pas-core = { path = "../pas-core" }
portable-pty = "0.9"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
vt100 = "0.18"

[dev-dependencies]
tempfile = "3"
